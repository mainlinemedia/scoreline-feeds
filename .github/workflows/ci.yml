name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast suite against the WordPress stubs, on every PHP the plugin claims
  # to support. Warnings, notices and deprecations fail a test.
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zip, iconv
          coverage: none
      - name: Lint
        run: find scoreline-feeds tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Release metadata is consistent
        run: php tests/check-release.php
      - name: Suite
        run: php tests/run-tests.php
      - name: Suite, reverse order
        run: MMGRF_TEST_ORDER=reverse php tests/run-tests.php
      - name: Suite, shuffled order
        run: MMGRF_TEST_ORDER=shuffle php tests/run-tests.php

  # The same plugin on a REAL WordPress: real core functions, real rewrite
  # rules, real media sizes, real HTTP. This is the class of bug the stub
  # suite cannot see (entity-encoded names, "-scaled" originals, sticky
  # posts, core answering conditional GETs before the plugin runs).
  integration:
    name: Integration (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: 'latest', php: '8.3' }
          - { wp: '5.8', php: '7.4' }
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_ROOT: /tmp/wordpress
      SITE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, mysqli, gd, zip, iconv, curl
          tools: wp-cli
          coverage: none
      - name: Install WordPress
        run: |
          mkdir -p "$WP_ROOT" && cd "$WP_ROOT"
          wp core download --version=${{ matrix.wp }} --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp core install --url="$SITE_URL" --title="Bob's Sports & More" \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.org --skip-email --quiet
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp option update blogdescription "Scores & stories"
          wp option update timezone_string "America/New_York"
          wp rewrite structure '/%postname%/' --hard --quiet
      - name: Install the plugin and seed content
        run: |
          cd "$WP_ROOT"
          cp -r "$GITHUB_WORKSPACE/scoreline-feeds" wp-content/plugins/scoreline-feeds
          wp plugin activate scoreline-feeds
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/seed.php"
      - name: Serve
        run: |
          cd "$WP_ROOT"
          nohup wp server --host=127.0.0.1 --port=8080 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$SITE_URL/" && break; sleep 1; done
      - name: Assert feeds over HTTP
        run: php tests/integration/assert.php "$SITE_URL" "$WP_ROOT"
      - name: Server log (on failure)
        if: failure()
        run: tail -n 100 /tmp/server.log; cat "$WP_ROOT/wp-content/debug.log" 2>/dev/null | tail -n 100 || true
